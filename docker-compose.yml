services:
  backend:
    build: ./backend
    container_name: vote-backend
    expose:
      - "8001"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: vote-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
