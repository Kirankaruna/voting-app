services:
  postgres:
    image: postgres:16
    container_name: vote-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: votes
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d votes"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: vote-backend
    ports:
    - "0.0.0.0:8001:8001"
    - "[::]:8001:8001"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: vote-frontend
    ports:
      - "0.0.0.0:3000:3000"
      - "[::]:3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data: