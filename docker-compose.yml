services:
  backend:
    build: ./backend
    container_name: vote-backend
    expose:
      - "8001"
    environment:
      - DB_PATH=/data/votes.db
      - CORS_ORIGINS=http://localhost:3000
    volumes:
      - vote-data:/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: vote-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  vote-data:
